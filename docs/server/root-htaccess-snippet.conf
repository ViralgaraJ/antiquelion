# ---------------------------------------------------------------------------
# AntiqueLion: block developer files at the site root (ANTIQUE-7)
#
# The root /.htaccess is git-ignored and exists only on the server (it holds
# the HTTPS/www redirects, security headers and rewrite rules), so these rules
# cannot be deployed by git pull. Add them ONCE by hand:
#
#   cPanel -> File Manager -> public_html -> .htaccess -> Edit
#   paste this block at the TOP of the file, above the rewrite rules, save.
#
# Then check in a browser that each of these returns 403:
#   /CLAUDE.md  /README.md  /config-sample.php  /dev-router.php
# and that the home page, a listing page and /oc-admin/ still load.
#
# Folders docs/, .github/ and tests/ are blocked by their own tracked .htaccess.
# ---------------------------------------------------------------------------
<FilesMatch "^(CLAUDE\.md|README\.md|config-sample\.php|dev-router\.php|dev-server\.sh|CHANGELOG\.txt|\.gitignore)$">
  <IfModule mod_authz_core.c>
    Require all denied
  </IfModule>
  <IfModule !mod_authz_core.c>
    Order allow,deny
    Deny from all
  </IfModule>
</FilesMatch>
